# Builds the signed release APK and attaches it to a GitHub Release.
#
# ---------------------------------------------------------------------------
# SECURITY
# This repository is PUBLIC, so treat these four secrets as fleet-critical.
# The signing key can overwrite the app on every phone that ever installed a
# build signed with it. Two consequences:
#
#   1. This workflow must never run for a pull_request. Fork PRs do not receive
#      secrets, but running the build there at all only widens the surface.
#   2. Anyone with WRITE access can edit this file to exfiltrate the key. A
#      public repo's write collaborators are therefore in the trust boundary for
#      every customer's fleet. Keep the collaborator list short and reviewed.
#
# Never print a secret, and never write one into an artifact or a log line.
# ---------------------------------------------------------------------------
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release.keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#
# Required repository variable (Settings > Secrets and variables > Actions >
# Variables), so a customer using their own key can point this at themselves:
#   ANDROID_EXPECTED_FINGERPRINT   SHA-256 of their signing certificate
#
# Before the first run:
#   gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -i android/release.keystore)
#   gh secret set ANDROID_KEYSTORE_PASSWORD
#   gh secret set ANDROID_KEY_ALIAS
#   gh secret set ANDROID_KEY_PASSWORD
#   gh variable set ANDROID_EXPECTED_FINGERPRINT \
#     --body "$(keytool -list -v -keystore android/release.keystore -alias <alias> \
#       -storepass <pass> | awk '/SHA256:/{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"

name: Android release

on:
  push:
    tags:
      - 'v*'

# Nothing else is needed. Not `pull_request`, not `workflow_dispatch` on a PR.
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          TAG="${GITHUB_REF_NAME}"
          echo "VERSION file: $VERSION"
          echo "git tag:       $TAG"
          # The tag is what a human typed; the VERSION file is what the APK will
          # actually contain. Publishing them out of step advertises a build
          # that does not exist.
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match the VERSION file ($VERSION)." \
                 "Update VERSION in the same commit as the tag."
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        # AGP 8.7.3 requires 17+. Gradle 8.11.1 supports JVM 8-23, so a newer
        # JDK here would break the daemon at startup.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        # Deliberately not android-actions/setup-android: it shells out to
        # `sdkmanager tools`, and Google removed the obsolete `tools` package
        # from the repository, so that action now fails with
        # "Failed to find package 'tools'". The runner already ships cmdline-tools.
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "using $SDKMANAGER"
          # Licenses first: without them the install prompts and fails.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # The build needs platform 35; a runner that ships it already is fine.
          ls -d "$ANDROID_SDK_ROOT/platforms/android-35" >/dev/null
          echo "Android SDK ready"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Decode straight to the file; never echo, never store in a var that
          # could reach a log.
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          chmod 600 release.keystore
          test -s release.keystore || { echo "::error::keystore is empty — is ANDROID_KEYSTORE_BASE64 correct?"; exit 1; }

      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # build.gradle.kts reads the keystore credentials from
          # android/local.properties, which is gitignored — so in CI it has to
          # be written here or the release silently comes out unsigned.
          # A heredoc with 'EOF' quoted keeps the shell from expanding anything
          # and keeps the values out of the trace.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local.properties
          # Deliberately not printing the contents.

      - name: Check the version is internally consistent
        run: ../scripts/check-version.sh

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK before it can reach a phone
        env:
          EXPECTED: ${{ vars.ANDROID_EXPECTED_FINGERPRINT }}
        run: |
          set -euo pipefail
          ARGS=(--skip-device)
          if [ -n "${EXPECTED:-}" ]; then
            ARGS+=(--expect-fingerprint "$EXPECTED")
          else
            echo "::warning::ANDROID_EXPECTED_FINGERPRINT is not set; falling back to the" \
                 "built-in shared key. A customer with their own key must set it."
          fi
          # Pins the signing certificate, so a wrong or rotated keystore fails
          # the build here instead of stranding every phone on an old build.
          ../scripts/preflight-update.sh app/build/outputs/apk/release/app-release.apk "${ARGS[@]}"

      - name: Upload APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: tracker-apk-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          # This step runs with working-directory: android, so the asset path is
          # relative to android/. (A `uses:` step is not — those run from the
          # workspace root, which is why upload-artifact takes android/… )
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::missing $APK"; exit 1; }
          cat > release-notes.md <<EOF
          Signed release \`$VERSION\`.

          Administrators: download the APK, then serve or install it as described
          in \`docs/signing.md\`. Sign it with the same long-lived key as previous
          releases — changing the key forces every phone to reinstall and loses
          its pairing.
          EOF
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes-file release-notes.md
