android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Do NOT set org.gradle.java.home here. This file is committed, so a machine
# specific absolute path breaks CI and every other developer's checkout. The JVM
# is supplied per environment instead:
#   CI            -> actions/setup-java (JDK 17)
#   local CLI     -> JAVA_HOME exported by the Android environment script
#   Android Studio-> the JetBrains Runtime bundled in the IDE
# It must be a JDK between 17 and 23: AGP 8.7.3 requires 17+, and Gradle 8.11.1
# refuses to start on JVM 24+.
kotlin.code.style=official
