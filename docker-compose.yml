services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [tracker]
    # PostgreSQL is intentionally NOT published to the host. Use `docker compose exec postgres psql`
    # or a one-off `docker run --network` for backups.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tracker:change-me@postgres:5432/tracker?schema=public}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5788}
      API_PORT: 4000
    ports:
      - '${API_PORT:-5789}:4000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [tracker]

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin by default: nginx proxies /api and /health to the backend.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5788}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks: [tracker]

volumes:
  postgres_data:

networks:
  tracker:
    driver: bridge
