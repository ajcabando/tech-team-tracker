# Same-origin deployment: the dashboard is served here and /api + /health are
# reverse-proxied to the backend container, so no CORS configuration is required.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Long-lived assets are content-hashed by Vite.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Signed release APK for private admin distribution. Served as a download
  # (never cached) with the Android package MIME type.
  location = /tracker.apk {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition "attachment; filename=tracker.apk";
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # The app shell must never be cached, or browsers keep running the previous
  # release after a deploy (the hashed asset names change underneath it).
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
  }

  # Server-Sent Events must not be buffered.
  location /api/dashboard/stream {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy no-referrer;
}
